services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: mortgage
      POSTGRES_DB: mortgage
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage -d mortgage"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.8.2
    command: server start-dev --ip 0.0.0.0 --ui-port 8233
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
