[project]
name = "mortgage-assistant"
version = "0.1.0"
description = "Ипотечный ассистент банка: учебный проект воркшопов модуля 2, LLM-разработчик"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx2>=2.13.1",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
